name: scraper-daily-forward
description: |
  One complete forward-only career cycle. Phase 1 publishes directly to
  Supabase, then local LM Studio is started and Phase 2 drains the durable
  enrichment queue. Source publication remains non-blocking, but the daily
  run is represented by one task and one completion report.

  The poll uses direct ATS endpoints first and the repository's existing
  fallback policy. It records official lifecycle health only after publication.

  Manual run:
    archon workflow run scraper-daily-forward --no-worktree

  Scheduling is owned by the Codex automation and re-anchored after a
  successful run. This file deliberately has no independent cron schedule.

nodes:
  - id: validate-portals
    bash: |
      cd scraper
      python main.py --dry-run --scope india
    timeout: 120000

  - id: poll-publish-and-enrich
    depends_on: [validate-portals]
    bash: |
      cd scraper
      python daily_cycle.py --scope india --company-cap 2000 --max-embeddings 100000 --max-messages 100000
    timeout: 21600000
